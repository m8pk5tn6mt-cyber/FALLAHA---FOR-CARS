<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجمع حلب الأول للسيارات - تواصل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #333;
        }

        .logo-container img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .main-content {
            padding: 50px 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .contact-section {
            margin-top: 40px;
        }

        .contact-label {
            color: #00bcd4;
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: block;
        }

        .contact-info {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .whatsapp-btn {
            background-color: #25d366;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s;
        }

        .whatsapp-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">مجمع حلب الأول</div>
        <div class="logo-container">
            <img src="logo.jpeg" alt="شعار مجمع حلب الأول">
        </div>
    </header>

    <main class="main-content">
        <h1>مرحباً بكم في مجمع حلب الأول للسيارات</h1>
        <p class="subtitle">نحن هنا لخدمتكم وتلبية كافة احتياجاتكم في عالم السيارات.</p>
        
        <div class="contact-section">
            <span class="contact-label">للتواصل الفوري والاستفسار:</span>
            <div class="contact-info">اتصال / واتساب على الرقم:</div>
            <!-- رابط واتساب مباشر، قم بتغيير الرقم لرقمك الحقيقي -->
            <a href="tel:+9639xxxxxxxx" class="whatsapp-btn">
                <svg height="24" viewBox="0 0 48 48" width="24" xmlns="http://www.w3.org/2000/svg"><path d="m38.05 9.95a19.78 19.78 0 0 0 -14.05-5.95 20.08 20.08 0 0 0 -17.31 30.15l-1.94 7.1 7.31-1.92a20 20 0 0 0 12.04 4.02h.01a20.08 20.08 0 0 0 14.05-34.22zm-14.05 28.05h-.01a16.44 16.44 0 0 1 -8.4-2.31l-.6-.35-6.2 1.63 1.65-6.05-.39-.62a16.56 16.56 0 0 1 -2.54-8.85a16.68 16.68 0 0 1 16.69-16.68a16.62 16.62 0 0 1 11.44 4.67a16.62 16.62 0 0 1 4.89 11.76a16.68 16.68 0 0 1 -16.7 16.69zm9.11-12.49c-.5-.25-2.94-1.45-3.4-1.61s-.77-.25-1.1.25s-1.28 1.61-1.57 1.94s-.57.28-1.07 0s-2.11-.78-4.02-2.48a14.74 14.74 0 0 1 -2.72-3.44c-.28-.47 0-.73.21-.97a4.65 4.65 0 0 0 .73-1.28a2.19 2.19 0 0 0 .1-1.92c-.1-.25-.94-2.28-1.28-3.18s-.68-.85-.92-.87h-.8a1.51 1.51 0 0 0 -1.09.52a5 5 0 0 0 -1.57 3.72a8.76 8.76 0 0 0 1.83 5.09a19.9 19.9 0 0 0 7.6 7.06c3.63 1.44 5.09 1.69 6.92 1.42a5.71 5.71 0 0 0 3.72-2.66a4.62 4.62 0 0 0 .32-2.66c-.14-.25-.48-.4-.99-.65z" fill="currentColor"/></svg>
                اتصال / واتساب
            </a>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 مجمع حلب الأول للسيارات. جميع الحقوق محفوظة.</p>
    </footer>

        console.log("تم تحميل صفحة التواصل بنجاح.");
    </script>

</body>
</html>
