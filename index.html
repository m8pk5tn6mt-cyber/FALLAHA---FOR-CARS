<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FALLAHA FOR CARS | النبضة المستقبلية 2036</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #020408;
            --neon-cyan: #00f3ff;
            --neon-purple: #b000ff;
            --text-light: #ffffff;
            --text-gray: #8a99ad;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* خلفية شبكية ديناميكية */
        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        /* الهيدر وشعار الموقع */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2.5rem 6%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .brand img {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
            object-fit: cover;
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, var(--text-light), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* المحتوى الرئيسي */
        main {
            text-align: center;
            padding: 2rem 5%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .hero-tag {
            display: inline-block;
            padding: 0.4rem 1.5rem;
            background: rgba(176, 0, 255, 0.1);
            border: 1px solid var(--neon-purple);
            color: #d175ff;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            box-shadow: 0 0 15px rgba(176, 0, 255, 0.2);
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 1.5rem;
        }

        h1 span {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.description {
            color: var(--text-gray);
            font-size: 1.15rem;
            max-width: 650px;
            margin: 0 auto 3.5rem auto;
            line-height: 1.8;
        }

        /* أزرار التفاعل */
        .actions {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1rem 2.8rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--neon-cyan);
            color: var(--bg-base);
            border: none;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
        }

        .btn-primary:hover {
            background: var(--text-light);
            box-shadow: 0 0 40px var(--neon-cyan);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.05);
        }

        /* الفوتر */
        footer {
            text-align: center;
            padding: 2.5rem;
            color: var(--text-gray);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>

    <header>
        <div class="brand">
            <img src="logo.jpeg" alt="FALLAHA FOR CARS Logo">
            <div class="brand-title">FALLAHA <span style="color: var(--neon-cyan); font-weight: 300;">2036</span></div>
        </div>
    </header>

    <main>
        <div class="hero-tag">رؤية الجيل القادم</div>
        <h1>مستقبل السيارات يبدأ هنا <span>بإبداع بلا حدود</span></h1>
        <p class="description">انتقال نوعي في تجربة العرض الرقمي، مصمم خصيصاً ليحاكي تطلعات المستقبل بقالب يدمج الفخامة والتقنية الخالصة.</p>
        
        <div class="actions">
            <a href="#" class="btn btn-primary" onclick="alert('تم تفعيل الأنظمة الذكية بنجاح!')">استكشاف الأفق</a>
            <a href="#" class="btn btn-secondary" onclick="alert('جاري مزامنة بيانات العرض...')">أنظمة القيادة</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2036 FALLAHA FOR CARS. جميع الحقوق محفوظة للرؤية التقنية.</p>
    </footer>

</body>
</html>
